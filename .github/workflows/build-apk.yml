name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: android-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Android project structure
        run: |
          set -e
          echo '' | base64 -d > 'settings.gradle.kts'
          echo 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjQuMSIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMS45LjI0IiBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle.kts'
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==' | base64 -d > 'gradle.properties'
          mkdir -p 'app'
          echo '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p 'app/src/main'
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p 'app/src/main/java/com/example/freevpn'
          echo '' | base64 -d > 'app/src/main/java/com/example/freevpn/MainActivity.kt'
          mkdir -p 'app/src/main/java/com/example/freevpn'
          echo '' | base64 -d > 'app/src/main/java/com/example/freevpn/FreeVpnService.kt'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenShield-VPN-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
